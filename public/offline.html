<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LigaLab — sin conexión</title>
    <!--
      Esta página existe para UN momento: abrir la app instalada sin cobertura.

      Sin ella, iOS enseña la pantalla de error de Safari —con su barra de
      direcciones y su "Safari no puede abrir la página"—, que es exactamente lo
      que rompe la ilusión de que esto es una app y además deja sin salida: en
      modo pantalla completa no hay botón de recargar a la vista.

      Va suelta y sin depender de nada: ni JS de Next, ni fuentes, ni imágenes.
      Un fichero que necesita descargar algo para pintarse no sirve de página
      para cuando no se puede descargar nada.

      Lo que NO hace: fingir que la app funciona sin conexión. LigaLab lee datos
      de LALIGA en vivo, así que sin red no hay nada que enseñar y decirlo es lo
      honesto.
    -->
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; }
      body {
        display: grid;
        place-items: center;
        padding: max(1.5rem, env(safe-area-inset-top)) 1.5rem max(1.5rem, env(safe-area-inset-bottom));
        background: linear-gradient(180deg, #08070a 0%, #050506 60%, #020203 100%);
        color: #f7f5ff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
        text-align: center;
      }
      .marca {
        display: grid;
        place-items: center;
        width: 64px;
        height: 64px;
        margin: 0 auto 1.5rem;
        border-radius: 20px;
        background: #7c3aed;
        box-shadow: 0 0 32px rgba(124, 58, 237, 0.4);
        font-size: 24px;
        font-weight: 900;
        letter-spacing: -0.02em;
      }
      h1 { margin: 0 0 0.75rem; font-size: 22px; letter-spacing: -0.02em; }
      p { margin: 0 auto; max-width: 30ch; color: #a8a3b3; font-size: 14px; line-height: 1.5; }
      button {
        margin-top: 1.75rem;
        min-height: 48px;
        padding: 0 1.5rem;
        border: 0;
        border-radius: 16px;
        background: #7c3aed;
        color: #fff;
        font: inherit;
        font-size: 15px;
        font-weight: 700;
      }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <div class="marca" aria-hidden="true">LL</div>
      <h1>Sin conexión</h1>
      <p>
        LigaLab lee tu liga de LALIGA en directo, así que necesita internet para
        enseñarte algo real. En cuanto vuelvas a tener cobertura, sigue donde lo
        dejaste.
      </p>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
