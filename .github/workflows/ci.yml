name: Apply nullable market fix
on:
  pull_request:
    types: [ready_for_review]
permissions:
  contents: write
jobs:
  patch-and-verify:
    if: github.event.pull_request.number == 7 && github.event.pull_request.head.ref == 'agent/laliga-private-readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/laliga-private-readonly
      - name: Apply patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          p = Path('app/fantasy-app.tsx')
          s = p.read_text()
          old1 = '''  const liveCards = data.market
            .map((entry) => ({
              entry,
              player: playersById[entry.player_id],
            }))
            .filter((row) => row.player)
            .filter(({ player }) =>
              player.full_name.toLowerCase().includes(query.toLowerCase()),
            );'''
          new1 = '''  const liveCards = data.market
            .map((entry) => {
              const player = entry.player_id ? playersById[entry.player_id] : null;
              const name = player?.full_name ?? entry.imported_name;
              const position = player?.position ?? entry.imported_position;
              const club = player?.club_id
                ? clubsById[player.club_id]?.short_name ?? "Sin club"
                : entry.imported_club ?? "Sin club";

              if (!name || !position) return null;

              return {
                entry,
                name,
                position,
                club,
                status: player?.status ?? "available",
              };
            })
            .filter((row): row is NonNullable<typeof row> => row !== null)
            .filter(({ name }) =>
              name.toLowerCase().includes(query.toLowerCase()),
            );'''
          old2 = '''          {liveCards.map(({ entry, player }) => (
                    <article className="market-card" key={entry.id}>
                      <div className="market-card-top">
                        <PlayerAvatar name={player.full_name} status={player.status} />
                        <div>
                          <strong>{player.full_name}</strong>
                          <span>
                            {player.position} ·{" "}
                            {player.club_id
                              ? clubsById[player.club_id]?.short_name ?? "Sin club"
                              : "Sin club"}
                          </span>
                        </div>
                      </div>'''
          new2 = '''          {liveCards.map(({ entry, name, position, club, status }) => (
                    <article className="market-card" key={entry.id}>
                      <div className="market-card-top">
                        <PlayerAvatar name={name} status={status} />
                        <div>
                          <strong>{name}</strong>
                          <span>{position} · {club}</span>
                        </div>
                      </div>'''
          if old1 not in s or old2 not in s:
              raise SystemExit('expected blocks not found')
          p.write_text(s.replace(old1, new1, 1).replace(old2, new2, 1))
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/fantasy-app.tsx
          git commit -m "fix: support nullable market player ids"
          git push origin HEAD:agent/laliga-private-readonly
