name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply nullable market patch
        if: github.event_name == 'pull_request'
        id: market_patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/fantasy-app.tsx')
          text = path.read_text()

          old_cards = '''  const liveCards = data.market
    .map((entry) => ({
      entry,
      player: playersById[entry.player_id],
    }))
    .filter((row) => row.player)
    .filter(({ player }) =>
      player.full_name.toLowerCase().includes(query.toLowerCase()),
    );'''

          new_cards = '''  const liveCards = data.market
    .map((entry) => {
      const player = entry.player_id ? playersById[entry.player_id] : null;
      const name = player?.full_name ?? entry.imported_name;
      const position = player?.position ?? entry.imported_position;
      const club = player?.club_id
        ? clubsById[player.club_id]?.short_name ?? "Sin club"
        : entry.imported_club ?? "Sin club";

      if (!name || !position) return null;
      return {
        entry,
        name,
        position,
        club,
        status: player?.status ?? "available",
      };
    })
    .filter((row): row is NonNullable<typeof row> => row !== null)
    .filter(({ name }) =>
      name.toLowerCase().includes(query.toLowerCase()),
    );'''

          old_render = '''          {liveCards.map(({ entry, player }) => (
            <article className="market-card" key={entry.id}>
              <div className="market-card-top">
                <PlayerAvatar name={player.full_name} status={player.status} />
                <div>
                  <strong>{player.full_name}</strong>
                  <span>
                    {player.position} ·{" "}
                    {player.club_id
                      ? clubsById[player.club_id]?.short_name ?? "Sin club"
                      : "Sin club"}
                  </span>
                </div>
              </div>'''

          new_render = '''          {liveCards.map(({ entry, name, position, club, status }) => (
            <article className="market-card" key={entry.id}>
              <div className="market-card-top">
                <PlayerAvatar name={name} status={status} />
                <div>
                  <strong>{name}</strong>
                  <span>{position} · {club}</span>
                </div>
              </div>'''

          changed = False
          if old_cards in text:
              text = text.replace(old_cards, new_cards, 1)
              changed = True
          if old_render in text:
              text = text.replace(old_render, new_render, 1)
              changed = True
          if changed:
              path.write_text(text)
          PY

          if git diff --quiet -- app/fantasy-app.tsx; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit nullable market patch
        if: steps.market_patch.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/fantasy-app.tsx
          git commit -m "fix: render nullable imported market entries"
          git push origin HEAD:${{ github.head_ref }}

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload failed build log
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: failed-build-log
          path: build.log
          retention-days: 1

      - name: Fail when build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
