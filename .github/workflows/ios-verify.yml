name: iOS verify

on:
  pull_request:
    paths:
      - "ios/**"
      - "mobile-shell/**"
      - "app/fantasy/mobile-auth.ts"
      - "capacitor.config.json"
      - ".github/workflows/ios-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      # El proyecto iOS vive en el repo (ios/), con el plugin y el controlador
      # que lo registra ya dentro del target. Solo hay que copiar la web.
      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build for iPhone simulator
        shell: bash
        run: |
          set +e
          set -o pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath .ios-derived \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee xcodebuild.log
          status=${PIPESTATUS[0]}

          if [ "$status" -ne 0 ]; then
            {
              echo '## xcodebuild failure'
              echo
              echo '```text'
              grep -E '(^|[[:space:]])(error:|fatal error:)|LaligaOAuthPlugin.swift' xcodebuild.log | tail -n 120
              echo '```'
              echo
              echo '<details><summary>Last 180 lines</summary>'
              echo
              echo '```text'
              tail -n 180 xcodebuild.log
              echo '```'
              echo '</details>'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          exit "$status"
