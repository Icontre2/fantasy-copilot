name: Android verify

on:
  pull_request:
    paths:
      - "android/**"
      - "mobile-shell/**"
      - "capacitor.config.json"
      - "app/fantasy/mobile-auth.ts"
      - ".github/workflows/android-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install web dependencies
        run: npm ci

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      # El APK de depuración se puede instalar directamente en un Android
      # para probar (Ajustes → permitir instalar apps de origen desconocido).
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ligalab-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
